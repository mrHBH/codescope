<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>codescope</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1b; }
      canvas { display: block; }
      #fps {
        position: fixed; top: 8px; left: 8px; z-index: 1;
        font: 12px ui-monospace, monospace; color: #fff;
        background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px;
        pointer-events: none; user-select: none;
      }
      #error {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
        color: #f44; font: 14px ui-monospace, monospace; display: none;
      }
    </style>
  </head>
  <body>
    <div id="fps">-- fps</div>
    <div id="error"></div>
    <script type="module" src="/src/playground/main.ts"></script>
  </body>
</html>
